name: Android CI

# Сборка debug-APK, юнит-тесты (JVM) и нативные тесты (g++) на каждый push в main и в рабочие ветки,
# на pull request и вручную. Артефакт: vibetoon-debug.apk (+ отчёты тестов).
on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "35.0.0"
  # Отпечаток debug-ключа (applicationId com.vibetoon): полный SHA-256 можно задать переменной репозитория
  # VT_DEBUG_CERT_SHA256; иначе сверяются известные начало и конец 02e8a1d4…f3b88003.
  EXPECTED_CERT_SHA256: ${{ vars.VT_DEBUG_CERT_SHA256 }}
  EXPECTED_CERT_PREFIX: "02e8a1d4"
  EXPECTED_CERT_SUFFIX: "f3b88003"

jobs:
  native-tests:
    name: Native tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ViewMath (canvas rotation math)
        run: bash tools/ci/native_tests.sh

  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже есть в образе ubuntu-latest ($ANDROID_HOME): доставляем нужные пакеты sdkmanager'ом
      - name: SDK packages (platform 35, build-tools, NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "ANDROID_HOME=$ANDROID_HOME, sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug keystore from secret (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibetoon-debug.keystore"
            echo "VT_DEBUG_KEYSTORE=$RUNNER_TEMP/vibetoon-debug.keystore" >> "$GITHUB_ENV"
            echo "VT_KEY_FROM_SECRET=1" >> "$GITHUB_ENV"
            echo "Подпись: ключ проекта из секрета DEBUG_KEYSTORE_BASE64"
          else
            echo "VT_KEY_FROM_SECRET=0" >> "$GITHUB_ENV"
            echo "::warning title=Debug key::Секрет DEBUG_KEYSTORE_BASE64 не задан: APK подписан временным debug-ключом раннера, отпечаток не совпадёт с 02e8a1d4…f3b88003 (поверх установленной сборки не встанет)."
          fi

      - name: Unit tests
        run: bash tools/ci/gradle_run.sh testDebugUnitTest
        env:
          VT_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          VT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          VT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Assemble debug APK
        run: bash tools/ci/gradle_run.sh assembleDebug
        env:
          VT_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          VT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          VT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Verify signature and fingerprint
        run: bash tools/ci/check_apk.sh app/build/outputs/apk/debug/vibetoon-debug.apk

      - name: Upload vibetoon-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: vibetoon-debug.apk
          path: app/build/outputs/apk/debug/vibetoon-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
